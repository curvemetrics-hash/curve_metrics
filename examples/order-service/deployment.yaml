apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: checkout-dev
  labels:
    app: order-service
    team: checkout
    environment: dev
    managed-by: curve-metrics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        team: checkout
    spec:
      containers:
        - name: web
          image: ghcr.io/my-org/order-service:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # Zero hardcoded credentials!
          # Curve Metrics automatically injects these into the checkout-dev namespace
          envFrom:
            - configMapRef:
                name: curve-cloud-resources
            - secretRef:
                name: curve-app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: checkout-dev
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: order-service
