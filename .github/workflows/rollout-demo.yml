# Weekly run of the whole rollout demo, so a dependency that drifts is noticed within a week.
# STATUS: written but NOT yet run on GitHub. Expect to fix small things on the first run
# (for example scripts/local-up.sh was only tested on macOS with Colima).
name: rollout-demo
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.2
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: pip install pytest
      - run: python3 -m pytest -q tests
      - run: scripts/local-up.sh
      - run: scripts/rollout_demo.sh 6
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollout-report
          path: site/
